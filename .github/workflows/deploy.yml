name: deploy
# Manual-only for now — we deploy locally (`just deploy-*`). Re-enable auto by
# adding a `push:` trigger when ready. Does NOT push back to the deploy branch.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need previous commit to diff changed paths

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.14" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }

      - name: Detect changed services
        id: changed
        run: |
          base="${{ github.event.before }}"
          # fall back to first-parent if before is all-zeros (first push)
          if ! git cat-file -e "$base" 2>/dev/null; then base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"; fi
          diff="$(git diff --name-only "$base" ${{ github.sha }})"
          echo "$diff"
          grep -qE '^(workers/api/|packages/ts-shared/)' <<<"$diff" && echo "api=1" >> "$GITHUB_OUTPUT" || echo "api=0" >> "$GITHUB_OUTPUT"
          grep -qE '^(apps/web/|packages/ts-shared/)' <<<"$diff" && echo "web=1" >> "$GITHUB_OUTPUT" || echo "web=0" >> "$GITHUB_OUTPUT"
          grep -qE '^workers/edge/' <<<"$diff" && echo "worker=1" >> "$GITHUB_OUTPUT" || echo "worker=0" >> "$GITHUB_OUTPUT"
          grep -qE '^(workers/auth/|packages/auth-shared/)' <<<"$diff" && echo "auth=1" >> "$GITHUB_OUTPUT" || echo "auth=0" >> "$GITHUB_OUTPUT"
          grep -qE '^apps/auth-web/' <<<"$diff" && echo "authweb=1" >> "$GITHUB_OUTPUT" || echo "authweb=0" >> "$GITHUB_OUTPUT"

      - run: bun install --frozen-lockfile

      - name: Deploy api (Cloudflare Worker)
        if: steps.changed.outputs.api == '1' && env.CF != ''
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          (cd workers/api && bunx wrangler deploy)
          bash infra/record-deploy.sh api "run-${{ github.run_id }}"

      - name: Deploy web (Cloudflare Pages)
        if: steps.changed.outputs.web == '1' && env.CF != ''
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bun run --filter @meowerse/web build
          bunx wrangler pages deploy apps/web/dist --project-name meowerse-web --commit-hash "$(git rev-parse HEAD)"
          bash infra/record-deploy.sh web "run-${{ github.run_id }}"

      - name: Deploy worker (wrangler)
        if: steps.changed.outputs.worker == '1' && env.CF != ''
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          (cd workers/edge && bunx wrangler deploy --message "$(git rev-parse --short HEAD)")
          bash infra/record-deploy.sh worker "run-${{ github.run_id }}"

      - name: Deploy auth (Cloudflare Worker)
        if: steps.changed.outputs.auth == '1' && env.CF != ''
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          (cd workers/auth && bunx wrangler deploy)
          bash infra/record-deploy.sh auth "run-${{ github.run_id }}"

      - name: Deploy auth-web (Cloudflare Pages)
        if: steps.changed.outputs.authweb == '1' && env.CF != ''
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bun run --filter @meowerse/auth-web build
          bunx wrangler pages deploy apps/auth-web/dist --project-name meowerse-auth-web --commit-hash "$(git rev-parse HEAD)"
          bash infra/record-deploy.sh auth-web "run-${{ github.run_id }}"
      # No commit-back: we never push to the deploy branch from CI. deploy-state
      # is maintained by local `just deploy-*` runs.
